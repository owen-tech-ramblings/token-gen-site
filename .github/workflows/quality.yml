name: quality

# risk-based-targeted-v2

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.sha }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: [self-hosted, linux, x64, lil-zen-ci]
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Check current 3D quality limits, retry identity and private authentication
        run: node --test tools/chat-three-d.test.mjs

      - name: Preserve existing chat request behaviour
        run: node --test --test-name-pattern='^only Agent mode' tools/chat-agent-options.test.mjs

      - name: Install isolated browser test runtime
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/three-d-${{ github.sha }}/browsers
          NPM_CONFIG_CACHE: ${{ runner.temp }}/three-d-${{ github.sha }}/npm-cache
        run: |
          npm install --no-save --prefix ${{ runner.temp }}/three-d-${{ github.sha }}/runtime playwright@1.62.1
          ${{ runner.temp }}/three-d-${{ github.sha }}/runtime/node_modules/.bin/playwright install chromium

      - name: Check highest-quality settings and preserved desktop and mobile workflows
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/three-d-${{ github.sha }}/browsers
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/three-d-${{ github.sha }}/runtime/node_modules/playwright
        run: node tools/chat-three-d.browser.cjs

      - name: Check changed chat modules
        run: node --check chat.js && node --check chat-three-d.mjs && node --check cloudflare/private-api-bridge/worker.js

      - name: Check changed-file whitespace
        run: git diff --check HEAD^ HEAD

      - name: Remove this run's browser runtime
        if: always()
        run: rm -rf -- "${RUNNER_TEMP:?}/three-d-${GITHUB_SHA:?}"
