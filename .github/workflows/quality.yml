name: quality

# risk-based-targeted-v2

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.sha }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: [self-hosted, linux, x64, lil-zen-ci]
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Run three targeted Agent mode checks
        run: node --test tools/chat-agent-options.test.mjs

      - name: Check changed chat modules
        run: node --check chat.js && node --check chat-agent-options.mjs

      - name: Check changed-file whitespace
        run: git diff --check HEAD^ HEAD
